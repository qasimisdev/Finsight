x-backend: &backend
  build: ./backend
  restart: unless-stopped
  env_file: .env
  depends_on:
    redis:
      condition: service_healthy

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  api:
    <<: *backend
    ports:
      - "8000:8000"   # direct access for Swagger docs and load tests
    networks: [internal, default]

  worker:
    <<: *backend
    command: ["celery", "-A", "worker.tasks:celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    networks: [internal, default]

  # Web UI. Nginx serves the page and forwards /api/* to the backend, so nothing needs configuring.
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api
    networks: [default]

  # Isolated code execution: internal network only (no internet), tight limits.
  sandbox:
    build: ./backend
    command: ["uvicorn", "sandbox.server:app", "--host", "0.0.0.0", "--port", "9000"]
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 64
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks: [internal]

networks:
  internal:
    internal: true
  default: {}
